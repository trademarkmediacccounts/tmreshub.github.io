components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Asset:
      type: object
      required: [id, name, type, status, comments, views, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        duration: { type: ["string", "null"] }
        size: { type: ["string", "null"] }
        status: { type: string }
