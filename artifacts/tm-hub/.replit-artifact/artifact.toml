kind = "web"
previewPath = "/"
title = "TM Hub"
version = "1.0.0"
id = "artifacts/tm-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22706

[services.development]
run = "pnpm --filter @workspace/tm-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tm-hub", "run", "build" ]
publicDir = "artifacts/tm-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22706"
BASE_PATH = "/"
